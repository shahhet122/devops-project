<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevOps Project - Upload</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f5f5f5;
      color: #333;
    }

    h1 {
      color: #0078d4;
      border-bottom: 2px solid #0078d4;
      padding-bottom: 8px;
    }

    p {
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
      display: block;
    }

    button {
      background: #0078d4;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #005fa3;
    }

    .msg {
      margin-top: 15px;
      padding: 10px;
      background: #e6f4ea;
      border-left: 4px solid #34a853;
      color: #333;
    }

    a {
      color: #0078d4;
    }
  </style>
</head>
<body>
  <h1>Upload Image</h1>
  <p>Select a file to upload to Azure Blob Storage.</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for msg in messages %}
        <div class="msg">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*">
    <button type="submit">Upload</button>
  </form>

  <br>
  <a href="{{ url_for('index') }}">← Back to gallery</a>
</body>
</html>
