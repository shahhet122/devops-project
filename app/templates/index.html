<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevOps Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f5f5f5;
      color: #333;
    }

    h1 {
      color: #0078d4;
      border-bottom: 2px solid #0078d4;
      padding-bottom: 8px;
    }

    p {
      color: #555;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    th, td {
      text-align: left;
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #0078d4;
      color: white;
    }

    tr:hover {
      background-color: #f0f7ff;
    }

    a {
      color: #0078d4;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .empty {
      color: #888;
      margin-top: 20px;
    }

    .upload-link {
      display: inline-block;
      margin-top: 20px;
      background: #0078d4;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      text-decoration: none;
    }

    .upload-link:hover {
      background: #005fa3;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>DevOps Project</h1>
  <p>Images stored in Azure Blob Storage.</p>

  {% if blobs %}
  <table>
    <tr><th>File Name</th><th>Download</th></tr>
    {% for blob in blobs %}
    <tr>
      <td>{{ blob.name }}</td>
      <td><a href="{{ blob.url }}" target="_blank">Download</a></td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p class="empty">No files uploaded yet.</p>
  {% endif %}

  <br>
  <a class="upload-link" href="{{ url_for('upload') }}">Upload Image</a>
</body>
</html>
